name: CI

on:
  push:
    branches: [master, "fix/**"]
  pull_request:
    branches: [master]

# issue #38 (fusion#2 CI retrofit): one run per ref — a new push to the same
# branch cancels the superseded run instead of queueing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      # fusion-core is a local in-tree monorepo package (not on PyPI) — the
      # tenant tests import it, so check out the sibling repo and install it
      # before the package itself.
      - uses: actions/checkout@v4
        with:
          repository: dahai80/fusion-core
          path: fusion-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # issue #38: pip wheel cache keyed on the package manifest hash —
          # skips re-downloading pytest/fastapi/etc. when deps unchanged.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fusion-core sibling
        run: pip install -e ./fusion-core
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run unit tests (integration tests auto-skip without live upstreams)
        run: pytest tests/ -v --tb=short -q
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: .pytest_cache/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
