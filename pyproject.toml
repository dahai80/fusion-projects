[project]
name = "fusion-project-svc"
version = "0.7.4"
description = "Fusion-Projects - local-first AI project asset container service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "setproctitle>=1.3.0",
]

[project.optional-dependencies]
# fusion-core is a local in-tree monorepo package (not on PyPI) — it lives
# in an optional extra, matching fusion-agent-studio. All fusion_core
# imports are lazy + fail-soft, so its absence degrades gracefully to
# single-tenant mode in CI/local-dev. Install with `.[tenant]`.
tenant = [
    "fusion-core>=0.1.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["project_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live upstreams (fusion-gateway 11432 / fusion-mlx 11434 / fusion-rag 11436)",
]
